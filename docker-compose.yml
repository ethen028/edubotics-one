# Run Orbit on this computer: `docker compose up -d`, then open http://localhost:3000
# Staff on the same Wi-Fi open http://<this computer's IP address>:3000
# A fixed name keeps the same data when you replace this folder with a newer download.
name: edubotics-one

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: edubotics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: edubotics
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubotics"]
      interval: 3s
      retries: 20

  # Convex: Orbit's new database, moving in module by module (docs/CONVEX-MIGRATION-PLAN.md). The Notice board
  # lives here already; everything else is still in "db". Self-hosted on this computer, nothing goes online.
  convex:
    image: ghcr.io/convex/convex-backend:${CONVEX_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      INSTANCE_NAME: orbit
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?Set CONVEX_INSTANCE_SECRET in .env (see .env.example)}
      # The address browsers and file links use. Staff open Orbit on port 3000; Convex stays on 3210.
      CONVEX_CLOUD_ORIGIN: ${CONVEX_PUBLIC_URL:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_PUBLIC_SITE_URL:-http://127.0.0.1:3211}
      DISABLE_BEACON: "true"
      DOCUMENT_RETENTION_DELAY: "172800"
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      retries: 30
      start_period: 10s

  # Runs once: makes the key Orbit uses to load its functions into Convex, kept in the convex-keys volume.
  convex-admin-key:
    image: ghcr.io/convex/convex-backend:${CONVEX_VERSION:-latest}
    restart: "no"
    environment:
      INSTANCE_NAME: orbit
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?Set CONVEX_INSTANCE_SECRET in .env (see .env.example)}
    entrypoint: ["/bin/sh", "-c", "[ -s /keys/admin-key ] || ./generate_admin_key.sh | tail -n 1 > /keys/admin-key"]
    volumes:
      - convex-keys:/keys

  # Optional: Convex's own admin screens, for a developer. `docker compose --profile convex-dashboard up -d`,
  # then open http://localhost:6791 on this computer with the key from `docker compose exec app cat /convex-keys/admin-key`.
  convex-dashboard:
    image: ghcr.io/convex/convex-dashboard:${CONVEX_VERSION:-latest}
    profiles: ["convex-dashboard"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3210
    depends_on:
      convex:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      convex:
        condition: service_healthy
      convex-admin-key:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    environment:
      DATABASE_URL: postgresql://edubotics:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/edubotics
      # Set explicitly in production so encrypted settings survive host/volume replacement.
      # Office installs may leave it blank; docker/start.sh then creates a persistent value in app-data.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Where Next reaches Convex inside Docker. docker/start.sh loads Orbit's functions into it on every start
      # and makes the sign-in key pair the first time (kept in app-data).
      CONVEX_URL: http://convex:3210
      CONVEX_SELF_HOSTED_URL: http://convex:3210
      # The office network uses plain http, so the login cookie can't require https.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      PUBLIC_CAREERS_HOST: ${PUBLIC_CAREERS_HOST:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      REQUIRE_CAPTCHA: ${REQUIRE_CAPTCHA:-false}
      TEAMWORK_STORAGE_MB: ${TEAMWORK_STORAGE_MB:-}
      CALL_SERVER: ${CALL_SERVER:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # First admin login, created on first start only. Change the password after signing in.
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Daily backups (Admin → Backups, docs/backups.md). The folders are set in .env; see .env.example.
      BACKUP_DIR: /backups
      BACKUP_FOLDER_SHOWN: ${BACKUP_FOLDER:-the "backups" folder inside the edubotics-one folder}
      BACKUP_COPY_DIR: ${BACKUP_COPY_FOLDER:+/backup-copy}
      BACKUP_COPY_FOLDER_SHOWN: ${BACKUP_COPY_FOLDER:-}
    volumes:
      - app-data:/data
      - convex-keys:/convex-keys:ro
      - ${BACKUP_FOLDER:-./backups}:/backups
      # Without a second folder this is the same backups folder again, and the app doesn't copy to it.
      - ${BACKUP_COPY_FOLDER:-./backups}:/backup-copy

  # Makes the daily backups the app asks for, with the same PostgreSQL as the database.
  # To restore one: docker compose stop app, then docker compose run --rm backup restore <file>.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: edubotics
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PGDATABASE: edubotics
    volumes:
      - ${BACKUP_FOLDER:-./backups}:/backups
      - ${BACKUP_COPY_FOLDER:-./backups}:/backup-copy

  gateway:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  convex-data:
  convex-keys:
  caddy-data:
  caddy-config:
  db-data:
  app-data:
