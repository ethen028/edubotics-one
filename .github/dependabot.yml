# Opens a pull request when a package or a CI action has an update, so security fixes aren't missed.
# Nothing merges by itself: each pull request runs CI and waits for the owner.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [patch]
    ignore:
      # Big version jumps are planned by hand (they can change how the app works).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
