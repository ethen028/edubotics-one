name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks only read the code. The token GitHub hands this job can't push, comment or change settings.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci -d ci_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      SESSION_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      # Actions are pinned to an exact commit, so a moved tag can't change what runs here. Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild @prisma/engines esbuild
      - run: npx prisma generate
      - run: npm run security:secrets
      - run: npm run security:dependencies
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:security
      - run: npm run build
